name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install aiohttp
      - name: Reserve release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(python -c 'from scripts.build_opk import release_version; print(release_version())')"
          echo "Release version: $version"
          python scripts/release.py prepare --version "$version" --state "$RUNNER_TEMP/cockpit-release.json"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build Full, Lite and skill
        run: python scripts/build_opk.py --output "$RUNNER_TEMP/cockpit-release"
      - name: Upload and publish the reserved release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release.py publish --state "$RUNNER_TEMP/cockpit-release.json" --assets "$RUNNER_TEMP/cockpit-release"
