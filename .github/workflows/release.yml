name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本，须与插件和 skill 一致（例如 v0.2.0）'
        required: true
        type: string
        default: v0.2.0

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install aiohttp
      - name: Reserve release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release.py prepare --version "$RELEASE_VERSION" --state "$RUNNER_TEMP/cockpit-release.json"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build Full, Lite and skill
        run: python scripts/build_opk.py --output "$RUNNER_TEMP/cockpit-release"
      - name: Upload and publish the reserved release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release.py publish --state "$RUNNER_TEMP/cockpit-release.json" --assets "$RUNNER_TEMP/cockpit-release"
