name: Cross-platform tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: Linux
            architecture: x64
            pointer_bits: 64
            machines: x86_64,amd64
            platform_tag: x86_64
          - runner: ubuntu-24.04-arm
            system: Linux
            architecture: arm64
            pointer_bits: 64
            machines: aarch64,arm64
            platform_tag: aarch64
          - runner: windows-latest
            system: Windows
            architecture: x64
            pointer_bits: 64
            machines: amd64,x86_64
            platform_tag: win-amd64
          - runner: windows-latest
            system: Windows
            architecture: x86
            pointer_bits: 32
            machines: x86,i386,i686,amd64,x86_64
            platform_tag: win32
          - runner: windows-11-arm
            system: Windows
            architecture: arm64
            pointer_bits: 64
            machines: arm64,aarch64
            platform_tag: win-arm64
          - runner: macos-26-intel
            system: Darwin
            architecture: x64
            pointer_bits: 64
            machines: x86_64,amd64
            platform_tag: x86_64
          - runner: macos-latest
            system: Darwin
            architecture: arm64
            pointer_bits: 64
            machines: arm64,aarch64
            platform_tag: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_SYSTEM: ${{ matrix.system }}
      EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
      EXPECTED_POINTER_BITS: ${{ matrix.pointer_bits }}
      EXPECTED_MACHINES: ${{ matrix.machines }}
      EXPECTED_PLATFORM_TAG: ${{ matrix.platform_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.architecture }}
      - name: Verify runner and Python architecture
        run: >-
          python -c "import os,platform,struct,sys,sysconfig; machine=platform.machine().lower(); tag=sysconfig.get_platform().lower(); bits=struct.calcsize('P')*8; expected=set(os.environ['EXPECTED_MACHINES'].split(',')); print('python=%s system=%s machine=%s pointer_bits=%s platform=%s' % (sys.version.split()[0], platform.system(), machine, bits, tag)); assert sys.version_info[:2]==(3,11); assert platform.system()==os.environ['EXPECTED_SYSTEM']; assert machine in expected; assert bits==int(os.environ['EXPECTED_POINTER_BITS']); assert os.environ['EXPECTED_PLATFORM_TAG'] in tag"
      - name: Install host runtime dependency
        run: python -m pip install aiohttp
      - name: Run complete unit suite
        run: python -m unittest discover -s tests
      - name: Build packages in a temporary directory and verify Lite stripping
        shell: python
        run: |
          import subprocess
          import sys
          import tempfile
          import zipfile
          from pathlib import Path

          with tempfile.TemporaryDirectory(prefix="cockpit-build-") as output:
              subprocess.run(
                  [sys.executable, "scripts/build_opk.py", "--output", output],
                  check=True,
              )
              root = Path(output)
              assert {path.name for path in root.iterdir()} == {
                  "OlivOSCockpit.opk", "OlivOSCockpitLite.opk", "olivos-cockpit-skill.zip"
              }
              with zipfile.ZipFile(root / "OlivOSCockpit.opk") as archive:
                  full_names = set(archive.namelist())
              with zipfile.ZipFile(root / "OlivOSCockpitLite.opk") as archive:
                  lite_names = set(archive.namelist())
              forbidden = {
                  "full_only.py", "adapter_tools.py", "file_write.py",
                  "account_write.py", "intercept.py", "plugin_install.py",
              }
              assert "_winfs.py" in full_names and "_winfs.py" in lite_names
              assert not (forbidden & lite_names), forbidden & lite_names
              assert "app.json" in lite_names and "__init__.py" in lite_names
